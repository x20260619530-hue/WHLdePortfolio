<head>

<title>王海丽 · AI Creative Portfolio</title>

<style>
/* src/components/About.css */
.profile-grid {
  display: grid;
  grid-template-columns: 460px 1fr;
  gap: 64px;
  align-items: start;
}

@media (max-width: 960px) {
  .profile-grid {
    grid-template-columns: 1fr;
    gap: 40px;
  }
}

/* ---- 左侧:工卡照片(整张合成好的图) ---- */
.profile-card-col {
  position: sticky;
  top: 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.profile-id-card-img {
  width: 100%;
  max-width: 440px;
  height: auto;
  filter: drop-shadow(0 30px 50px rgba(0, 0, 0, 0.55));
}

.profile-card-caption {
  align-self: flex-start;
  margin-top: 18px;
  margin-left: 8px;
  line-height: 1.7;
  opacity: 0.6;
}

/* 卡片下面那段引用式简介(原来在右边,现在挪到工卡下方) */
.profile-card-col .profile-quote-row {
  align-self: stretch;
  margin: 28px 0 0;
}

.profile-card-col .profile-quote-en,
.profile-card-col .profile-quote-cn {
  max-width: none;
}

@media (max-width: 960px) {
  .profile-card-col {
    position: static;
    align-items: flex-start;
  }
}

/* ---- 右侧上方:大标题区 ---- */
.profile-header-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}

.profile-title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(40px, 5vw, 72px);
  line-height: 1.02;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  color: var(--text);
  margin-top: 6px;
}

.profile-title .accent {
  color: var(--red);
}

.profile-title-cn {
  font-family: var(--font-cjk);
  font-size: 15px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
  margin-top: 8px;
}

.profile-corner-note {
  text-align: right;
  line-height: 1.7;
  opacity: 0.55;
  white-space: nowrap;
  padding-top: 10px;
}

/* ---- 引用式简介 ---- */
.profile-quote-row {
  display: flex;
  gap: 18px;
  margin: 36px 0 40px;
  padding-left: 4px;
  border-left: 1px solid var(--glass-border);
}

.profile-quote-bracket {
  font-family: var(--font-display);
  font-size: 48px;
  line-height: 1;
  color: var(--red);
  opacity: 0.7;
}

.profile-quote-text {
  min-width: 0;
}

.profile-quote-en {
  font-family: var(--font-mono);
  font-style: italic;
  font-size: 16px;
  line-height: 1.7;
  color: var(--text-dim);
  max-width: 640px;
  margin: 0 0 14px;
}

.profile-quote-cn {
  font-family: var(--font-cjk);
  font-size: 16px;
  line-height: 1.9;
  color: var(--text);
  max-width: 640px;
}

.file-cabinet-hint {
  margin-bottom: 16px;
}

/* ---- 档案文件夹式工作经历 ---- */
.exp-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* 鼠标划过某一条经历时,给它一圈"流动的光泽描边"+ 轻微上浮,
   光泽是一段绕着卡片边框转圈的渐变色,常亮时是普通描边,
   划过去才会亮起来并转动(参考 aceternity 的 hover-border-gradient 效果,
   这里直接用纯 CSS 实现,不依赖额外组件库)。 */
@property --exp-glow-angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

.exp-item {
  position: relative;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-s);
  background: var(--bg-elevated);
  overflow: visible;
  transition: border-color 0.2s ease, transform 0.25s ease, box-shadow 0.25s ease;
}

.exp-item > .exp-row,
.exp-item > .exp-detail {
  position: relative;
  z-index: 1;
  border-radius: inherit;
  overflow: hidden;
}

.exp-item::before {
  content: "";
  position: absolute;
  inset: -1.5px;
  z-index: 0;
  border-radius: inherit;
  padding: 1.5px;
  background: conic-gradient(
    from var(--exp-glow-angle, 0deg),
    transparent 0%,
    var(--red) 12%,
    #ffb199 22%,
    var(--red) 32%,
    transparent 46%,
    transparent 100%
  );
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}

.exp-item:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 32px -18px rgba(255, 60, 32, 0.45);
}

.exp-item:hover::before {
  opacity: 1;
  animation: exp-glow-spin 2.4s linear infinite;
}

@keyframes exp-glow-spin {
  to {
    --exp-glow-angle: 360deg;
  }
}

.exp-item.is-open {
  border-color: var(--red);
}

@media (prefers-reduced-motion: reduce) {
  .exp-item,
  .exp-item::before {
    transition: none;
    animation: none;
  }
}

.exp-row {
  width: 100%;
  display: flex;
  padding: 16px 20px;
  background: transparent;
  border: none;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}

.exp-row-top {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
}

.exp-dots {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}

.exp-dots i {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--text-faint);
  display: block;
}

.exp-switch {
  flex-shrink: 0;
  width: 30px;
  height: 16px;
  border-radius: 999px;
  background: var(--bg-soft);
  border: 1px solid var(--glass-border);
  position: relative;
  transition: background 0.2s ease, border-color 0.2s ease;
}

.exp-switch i {
  position: absolute;
  top: 1px;
  left: 1px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--text-faint);
  transition: transform 0.2s ease, background 0.2s ease;
}

.exp-switch.is-on {
  background: var(--red-dim);
  border-color: var(--red);
}

.exp-switch.is-on i {
  transform: translateX(14px);
  background: var(--red);
}

/* 公司名称 + 岗位——取代了原来的"EXPERIENCE 01-08"编号,
   一眼就能看清"我在哪家公司、做什么岗位",公司名加粗放大。 */
.exp-title-block {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-width: 0;
}

.exp-company-name {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 17px;
  line-height: 1.3;
  color: var(--text);
  white-space: normal;
  overflow-wrap: break-word;
}

.exp-role-inline {
  font-size: 11px;
  letter-spacing: 0.02em;
  color: var(--text-faint);
}

.exp-year {
  white-space: nowrap;
  color: var(--text-faint);
}

.exp-plus {
  flex-shrink: 0;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  color: var(--text-dim);
}

.exp-detail {
  overflow: hidden;
}

.exp-detail-inner {
  display: grid;
  grid-template-columns: 2fr 1fr auto;
  gap: 24px;
  padding: 4px 20px 22px;
  border-top: 1px dashed var(--glass-border);
  margin-top: 2px;
  padding-top: 18px;
}

.exp-detail-col {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.exp-detail-heading {
  color: var(--red);
  margin-bottom: 2px;
}

.exp-detail-line {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.5;
}

/* KEY PROJECTS 这一列内容比较长,超出高度就在这一列内部滚动看,
   不会把整个手风琴撑得很长 */
.exp-detail-projects-col {
  min-height: 0;
}

.exp-detail-scroll {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 190px;
  overflow-y: auto;
  padding-right: 10px;
}

.exp-detail-company {
  color: var(--text-faint);
}

/* ROLE 和 KEYWORDS 现在叠在同一列里,上下排布 */
.exp-detail-role-keywords-col {
  gap: 18px;
}

.exp-detail-role-block,
.exp-detail-keywords-block {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.exp-keywords {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.exp-keyword-tag {
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--glass-border);
  font-size: 10px;
}

/* 每条经历最右侧:对应公司/品牌的 logo 徽章。
   logo 图片本身已经抠掉背景了,这里给一张暖白色卡片当底,
   不管 logo 是黑色线稿还是彩色,都能看得清楚。 */
.exp-detail-thumb {
  flex-shrink: 0;
  width: 128px;
  height: 84px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  border-radius: var(--radius-s);
  background: var(--text);
  border: 1px solid var(--glass-border);
}

.exp-detail-thumb img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
}

@media (max-width: 700px) {
  .exp-row-top {
    flex-wrap: wrap;
    row-gap: 6px;
  }
  .exp-title-block {
    flex-basis: 100%;
    order: 1;
  }
  .exp-dots {
    order: 0;
  }
  .exp-switch {
    order: 0;
  }
  .exp-year {
    order: 2;
    margin-left: 46px;
  }
  .exp-plus {
    order: 3;
    margin-left: auto;
  }
  .exp-company-name {
    font-size: 15px;
  }
  .exp-detail-inner {
    grid-template-columns: 1fr;
  }
  .exp-detail-thumb {
    width: 128px;
  }
}

/* ---- 底部整条工具栏 ---- */
.profile-tools-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin-top: 72px;
  padding-top: 32px;
  border-top: 1px solid var(--glass-border);
  flex-wrap: wrap;
}

.profile-tools-label,
.profile-tools-note {
  line-height: 1.6;
  opacity: 0.6;
  white-space: nowrap;
}

.profile-tools-note {
  text-align: right;
}

@media (max-width: 700px) {
  .profile-tools-row {
    justify-content: flex-start;
  }
  .profile-tools-note {
    display: none;
  }
}


/* src/components/AccordionGallery.css */
.accordion-gallery {
  --ag-accent: #ffffff;
  --ag-overlay: #060010;
  --ag-text: #ffffff;
  --ag-gap: 10px;
  --ag-radius: 16px;
  --ag-media-size: 320px;

  display: flex;
  flex-direction: row;
  gap: var(--ag-gap);
  width: 100%;
  max-width: 100%;
  perspective: 1400px;
  perspective-origin: 50% 50%;
}

.accordion-gallery--vertical {
  flex-direction: column;
}

.ag-panel {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border-radius: var(--ag-radius);
  cursor: pointer;
  display: block;
  text-decoration: none;
  outline: none;
  transform-style: preserve-3d;
  transform-origin: center center;
  background: #0a0713;
  box-shadow: 0 10px 30px -18px rgba(0, 0, 0, 0.8);
  will-change: flex-grow, transform;
  -webkit-tap-highlight-color: transparent;
}

.ag-panel:focus-visible {
  box-shadow:
    0 0 0 2px var(--ag-accent),
    0 10px 30px -18px rgba(0, 0, 0, 0.8);
}

.ag-panel__frame {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: inherit;
}

.ag-panel__media {
  --ag-gray: 1;
  --ag-dim: 0.35;
  position: absolute;
  top: 50%;
  left: 50%;
  width: var(--ag-media-size);
  height: 100%;
  filter: grayscale(var(--ag-gray));
  will-change: transform, filter;
}

.accordion-gallery--vertical .ag-panel__media {
  width: 100%;
  height: var(--ag-media-size);
}

.ag-panel__media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
}

.ag-panel__overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, transparent 45%, color-mix(in srgb, var(--ag-overlay) 78%, transparent) 100%),
    color-mix(in srgb, var(--ag-overlay) calc(var(--ag-dim, 0.35) * 100%), transparent);
}

/* 书脊(没展开时露出来的窄窄一条)——参考实体书立在书架上的样子:
   最上面一整行是大大的编号(横排,不参与竖排),下面才是左右两列:
   中文书名一列、英文书名一列,两列并排,不是挤在同一列里;外面
   再描一圈双线边框,让它看起来真的像一本书的侧面。 */
.ag-panel__spine-label {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 12px 12px 14px;
  border-radius: 3px;
  background: rgba(8, 7, 14, 0.62);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  color: var(--ag-text);
  font-family: inherit;
  max-height: calc(100% - 28px);
  overflow: hidden;
  pointer-events: none;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
  transition: opacity 0.3s ease;
  border: 1px solid rgba(255, 255, 255, 0.55);
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.45),
    0 10px 20px -14px rgba(0, 0, 0, 0.8);
}

/* 内侧再描一条细线,双线边框才有"书封"的厚度感 */
.ag-panel__spine-label::before {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 2px;
  pointer-events: none;
}

/* 编号:独立一整行,横排、字号明显放大,压在书封最上面 */
.ag-panel__spine-index {
  display: block;
  writing-mode: horizontal-tb;
  font-family: var(--font-display, inherit);
  font-weight: 800;
  font-size: clamp(20px, 2.6vw, 30px);
  line-height: 1;
  letter-spacing: 0.02em;
  color: var(--ag-accent);
}

/* 编号下面这一块:左右两列并排 */
.ag-panel__spine-cols {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 10px;
  overflow: hidden;
}

/* 每一列都是自己单独竖排,两列左右并排放,互不影响 */
.ag-panel__spine-col {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  white-space: nowrap;
  letter-spacing: 0.06em;
}

.ag-panel__spine-cn {
  display: block;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.04em;
}

.ag-panel__spine-en {
  display: block;
  font-weight: 700;
  font-size: 17px;
  letter-spacing: 0.08em;
  opacity: 0.95;
}

.ag-panel--active .ag-panel__spine-label {
  opacity: 0;
}

.ag-panel__label {
  position: absolute;
  left: 20px;
  bottom: 20px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  pointer-events: none;
  z-index: 2;
}

.ag-panel__bar {
  flex: 0 0 auto;
  width: 3px;
  height: 26px;
  border-radius: 3px;
  background: var(--ag-accent);
  opacity: 0;
  box-shadow: 0 0 12px color-mix(in srgb, var(--ag-accent) 60%, transparent);
}

.ag-panel__text {
  color: var(--ag-text);
  font-family: inherit;
  font-weight: 600;
  font-size: clamp(1rem, 1.4vw, 1.4rem);
  letter-spacing: 0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55);
}

@media (max-width: 520px) {
  .accordion-gallery {
    flex-direction: column;
    perspective: none;
    height: auto !important;
  }
  .ag-panel {
    min-height: 84px;
    transform: none !important;
  }
  .accordion-gallery .ag-panel__media {
    width: 100%;
    height: var(--ag-media-size);
  }
}

@media (prefers-reduced-motion: reduce) {
  .ag-panel,
  .ag-panel__media {
    will-change: auto;
  }
}


/* src/components/AiPager.css */
/* 右下角悬浮"呼叫器"
   ------------------------------------------------------------
   造型和配色完全照着参考图来:透明的蓝紫色塑料掌机外壳、圆角厚
   实的机身、四角小螺丝、玻璃质感的圆形 A/B 按钮、像素风装饰边框
   的屏幕。这一份颜色跟网站主体的黑红色调不一样,是故意的——这是
   一个"藏在角落里的小玩具"式的互动细节,单独一套配色反而更像
   一个真实的实体小机器,不需要跟主视觉完全统一。 */

.ai-pager {
  --pager-a: #bfeaf2; /* 壳体渐变:浅青 */
  --pager-b: #cdbdf6; /* 壳体渐变:浅紫 */
  --pager-ink: #3c3468; /* 屏幕上的深靛蓝文字 */
  --pager-accent: #7a68e6; /* 按钮/强调色:蓝紫 */
  --pager-accent-dark: #5d4ed1;

  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 180;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 14px;
  pointer-events: none;
}

.ai-pager > * {
  pointer-events: auto;
}

/* ============================================================
   收起状态:小小的呼叫器图标
   ============================================================ */

.ai-pager-bubble {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  border: none;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.ai-pager-bubble-ring {
  position: absolute;
  top: 0;
  left: 50%;
  width: 64px;
  height: 64px;
  transform: translateX(-50%);
  border-radius: 24px;
  border: 1px solid var(--pager-accent);
  opacity: 0;
  animation: pager-ping 2.6s ease-out infinite;
  pointer-events: none;
}

.ai-pager-bubble-antenna {
  position: absolute;
  top: -9px;
  left: 50%;
  transform: translateX(-50%);
  width: 3px;
  height: 9px;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 2px;
  z-index: 1;
}

.ai-pager-bubble-antenna::before {
  content: "";
  position: absolute;
  top: -5px;
  left: 50%;
  transform: translateX(-50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--pager-accent);
  box-shadow: 0 0 8px var(--pager-accent);
}

.ai-pager-bubble-face {
  position: relative;
  width: 64px;
  height: 64px;
  border-radius: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: linear-gradient(140deg, var(--pager-a), var(--pager-b));
  border: 2px solid rgba(255, 255, 255, 0.7);
  box-shadow: 0 14px 26px -12px rgba(80, 60, 160, 0.55), inset 0 2px 3px rgba(255, 255, 255, 0.8),
    inset -5px -8px 14px rgba(90, 65, 170, 0.3);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  transition: box-shadow 0.2s ease, transform 0.2s ease;
}

.ai-pager-bubble:hover .ai-pager-bubble-face,
.ai-pager-bubble.is-open .ai-pager-bubble-face {
  box-shadow: 0 14px 26px -12px rgba(80, 60, 160, 0.6), inset 0 2px 3px rgba(255, 255, 255, 0.85),
    0 0 0 2px rgba(122, 104, 230, 0.55);
}

.ai-pager-bubble-screen {
  width: 26px;
  height: 16px;
  border-radius: 5px;
  background: linear-gradient(160deg, #eaf8f4, #dcecfb);
  box-shadow: inset 0 0 0 1.5px #2a2244, inset 0 2px 4px rgba(60, 52, 104, 0.25);
  position: relative;
  overflow: hidden;
}

.ai-pager-bubble-screen::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 30% 30%, var(--pager-accent) 0%, transparent 65%);
  opacity: 0.85;
  animation: pager-blip 1.8s ease-in-out infinite;
}

.ai-pager-bubble-btn {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  box-shadow: inset 0 0 0 1px rgba(80, 60, 160, 0.5);
}

.ai-pager-bubble-btn--a {
  bottom: 11px;
  right: 13px;
}

.ai-pager-bubble-btn--b {
  bottom: 11px;
  right: 22px;
}

.ai-pager-bubble-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  color: var(--text-dim);
  white-space: nowrap;
}

.ai-pager-bubble-label::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--pager-accent);
  box-shadow: 0 0 8px var(--pager-accent);
  animation: pager-blip 1.8s ease-in-out infinite;
}

@keyframes pager-ping {
  0% {
    opacity: 0.5;
    transform: translateX(-50%) scale(0.9);
  }
  100% {
    opacity: 0;
    transform: translateX(-50%) scale(1.35);
  }
}

@keyframes pager-blip {
  0%,
  100% {
    opacity: 0.35;
  }
  50% {
    opacity: 1;
  }
}

/* ============================================================
   展开状态:完整的"掌机"面板
   ============================================================ */

.ai-pager-device {
  position: relative;
  width: 284px;
  max-width: calc(100vw - 44px);
  padding: 30px 20px 20px;
  border-radius: 40px;
  background: linear-gradient(150deg, var(--pager-a) 0%, var(--pager-b) 100%);
  border: 2.5px solid rgba(255, 255, 255, 0.75);
  box-shadow: 0 34px 64px -22px rgba(70, 50, 150, 0.55), inset 0 3px 4px rgba(255, 255, 255, 0.75),
    inset -10px -16px 28px rgba(90, 65, 170, 0.28);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

/* 四个角上的小螺丝 —— 单独一层伪元素,四个 radial-gradient
   各自定位在四个角,不用额外加 DOM 节点 */
.ai-pager-device::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background-image: radial-gradient(circle 4.5px at 18px 18px, #fbfbff 0%, #b7b0d8 55%, transparent 60%),
    radial-gradient(circle 4.5px at calc(100% - 18px) 18px, #fbfbff 0%, #b7b0d8 55%, transparent 60%),
    radial-gradient(circle 4.5px at 18px calc(100% - 18px), #fbfbff 0%, #b7b0d8 55%, transparent 60%),
    radial-gradient(circle 4.5px at calc(100% - 18px) calc(100% - 18px), #fbfbff 0%, #b7b0d8 55%, transparent 60%);
}

.ai-pager-antenna {
  position: absolute;
  top: -15px;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 17px;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 2px;
}

.ai-pager-antenna::before {
  content: "";
  position: absolute;
  top: -7px;
  left: 50%;
  transform: translateX(-50%);
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--pager-accent);
  box-shadow: 0 0 10px var(--pager-accent);
}

.ai-pager-close {
  position: absolute;
  top: 12px;
  right: 14px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.8);
  background: rgba(255, 255, 255, 0.45);
  color: var(--pager-ink);
  font-size: 15px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.ai-pager-close:hover {
  background: rgba(255, 255, 255, 0.7);
}

/* ---- 屏幕 ---- */

.ai-pager-screen {
  position: relative;
  border-radius: 16px;
  padding: 12px 14px 10px;
  background: linear-gradient(165deg, #eef9f6 0%, #dcebfb 100%);
  box-shadow: inset 0 0 0 5px #221c3a, inset 0 0 0 6.5px rgba(255, 255, 255, 0.35),
    0 6px 14px -8px rgba(40, 30, 80, 0.4);
  font-family: var(--font-mono);
  color: var(--pager-ink);
  margin-bottom: 14px;
}

.ai-pager-screen-frameline {
  display: flex;
  align-items: center;
  gap: 6px;
  color: rgba(60, 52, 104, 0.55);
  font-size: 11px;
  margin-bottom: 6px;
}

.frameline-corner {
  flex-shrink: 0;
}

.frameline-dots {
  flex: 1;
  height: 0;
  border-top: 1.5px dotted rgba(60, 52, 104, 0.4);
}

.frameline-dots--full {
  width: 100%;
}

.frameline-spark {
  flex-shrink: 0;
  font-size: 10px;
  color: var(--pager-accent-dark);
}

.ai-pager-screen-topline {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--pager-accent-dark);
  opacity: 0.85;
  margin-bottom: 8px;
}

.ai-pager-live-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--pager-accent);
  box-shadow: 0 0 6px var(--pager-accent);
  animation: pager-blip 1.8s ease-in-out infinite;
}

.ai-pager-screen-title {
  font-family: var(--font-cjk);
  font-size: 15px;
  font-weight: 700;
  color: var(--pager-ink);
  text-align: center;
  margin-bottom: 4px;
}

.ai-pager-screen-subline {
  font-family: var(--font-cjk);
  font-size: 11px;
  color: rgba(60, 52, 104, 0.65);
  text-align: center;
  margin-bottom: 10px;
}

.ai-pager-screen-pillrow {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 6px;
}

.ai-pager-screen-pill {
  padding: 3px 12px;
  border-radius: 999px;
  border: 1.5px solid rgba(60, 52, 104, 0.45);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--pager-ink);
}

.ai-pager-screen-bottomline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 6px;
}

.ai-pager-heart {
  font-size: 12px;
  color: var(--pager-accent-dark);
}

.ai-pager-battery {
  display: inline-flex;
  align-items: flex-end;
  gap: 2px;
  color: var(--pager-ink);
}

.ai-pager-battery i {
  display: block;
  width: 3px;
  border-radius: 1px;
  background: currentColor;
  opacity: 0.85;
}

.ai-pager-battery i:nth-child(1) {
  height: 5px;
}
.ai-pager-battery i:nth-child(2) {
  height: 8px;
}
.ai-pager-battery i:nth-child(3) {
  height: 11px;
}

/* ---- 屏幕下方的小喇叭孔 ---- */

.ai-pager-speaker {
  display: block;
  width: 34px;
  height: 6px;
  margin: 0 auto 16px;
  background-image: radial-gradient(circle 1.6px, rgba(70, 58, 120, 0.45) 100%, transparent 0);
  background-size: 7px 7px;
  background-repeat: repeat-x;
  background-position: center;
}

/* ---- 方向键 + A/B ---- */

.ai-pager-body {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 16px;
}

.ai-pager-dpad {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, 30px);
  grid-template-rows: repeat(3, 30px);
  gap: 2px;
  flex-shrink: 0;
  padding: 6px;
  border-radius: 20px;
  background: linear-gradient(160deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.08));
  box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.6), inset -4px -6px 10px rgba(90, 65, 170, 0.2);
}

.dpad-key {
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: linear-gradient(150deg, #ded4fb, #b7a4f0);
  color: rgba(60, 52, 104, 0.85);
  font-size: 11px;
  cursor: pointer;
  text-decoration: none;
  box-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.75), inset 0 -3px 5px rgba(90, 65, 170, 0.3);
  transition: filter 0.15s ease;
}

.dpad-key:hover {
  filter: brightness(1.08);
}

.dpad-key--up {
  grid-column: 2;
  grid-row: 1;
  border-radius: 8px 8px 3px 3px;
}
.dpad-key--left {
  grid-column: 1;
  grid-row: 2;
  border-radius: 8px 3px 3px 8px;
}
.dpad-key--center {
  grid-column: 2;
  grid-row: 2;
  background: linear-gradient(150deg, #cabdf6, #a290ec);
  border-radius: 4px;
  cursor: default;
  box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.5);
}
.dpad-key--right {
  grid-column: 3;
  grid-row: 2;
  border-radius: 3px 8px 8px 3px;
}
.dpad-key--down {
  grid-column: 2;
  grid-row: 3;
  border-radius: 3px 3px 8px 8px;
}

.ai-pager-ab {
  display: flex;
  flex-direction: column;
  gap: 9px;
  flex: 1;
  min-width: 0;
}

.ab-key {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 14px 6px 6px;
  border-radius: 999px;
  border: 1.5px solid rgba(255, 255, 255, 0.7);
  background: rgba(255, 255, 255, 0.32);
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s ease;
}

.ab-key:hover {
  background: rgba(255, 255, 255, 0.5);
}

.ab-key-mark {
  position: relative;
  flex-shrink: 0;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(150deg, var(--pager-accent), var(--pager-accent-dark));
  box-shadow: inset 0 2px 2px rgba(255, 255, 255, 0.55), inset 0 -3px 5px rgba(50, 30, 110, 0.35),
    0 3px 6px -2px rgba(70, 50, 150, 0.6);
}

.ab-key-label {
  font-family: var(--font-cjk);
  font-size: 13px;
  font-weight: 600;
  color: var(--pager-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---- SELECT / START ---- */

.ai-pager-meta {
  display: flex;
  gap: 8px;
}

.meta-key {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 6px;
  border-radius: 14px;
  border: 1.5px solid rgba(255, 255, 255, 0.7);
  background: rgba(255, 255, 255, 0.3);
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s ease;
}

.meta-key:hover {
  background: rgba(255, 255, 255, 0.5);
}

.meta-key-mark {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.1em;
  color: rgba(60, 52, 104, 0.6);
}

.meta-key-label {
  font-family: var(--font-cjk);
  font-size: 12px;
  font-weight: 600;
  color: var(--pager-ink);
}

@media (max-width: 520px) {
  .ai-pager {
    right: 14px;
    bottom: 14px;
  }

  .ai-pager-device {
    width: 254px;
    padding: 26px 16px 16px;
  }
}


/* src/components/AigcVideoLibrary.css */
.aigc-section {
  overflow: hidden;
}

.aigc-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
  margin-bottom: 56px;
}

.aigc-tag {
  margin-top: 18px;
}

.aigc-note {
  display: flex;
  flex-direction: column;
  text-align: right;
  line-height: 1.7;
  opacity: 0.55;
  white-space: nowrap;
  padding-top: 10px;
}

/* ---- 整体两栏:左边CD架,右边播放器 ---- */
.aigc-layout {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 32px;
  align-items: start;
}

@media (max-width: 1100px) {
  .aigc-layout {
    grid-template-columns: 1fr;
  }
}

/* ---- 左边:CD 唱片架 ---- */
.aigc-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}

@media (max-width: 700px) {
  .aigc-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }
}

/* ---- 播放器"放大居中"模式下,CD架变成竖排一列 + 整体虚焦 ----
   自己是选中项、或者鼠标移上去的那一张,会恢复清晰、可以照常点击
   切换到别的视频;其余的保持模糊变暗,把视觉重心让给中间放大的
   播放器。 */
.aigc-grid.is-unfocused {
  grid-template-columns: 1fr;
  max-width: 320px;
  gap: 16px;
  margin: 0 auto;
  transition: grid-template-columns 0.5s ease, max-width 0.5s ease, gap 0.5s ease;
}

.aigc-grid.is-unfocused .aigc-disc {
  filter: blur(3px) brightness(0.7);
  opacity: 0.55;
  transform: scale(0.96);
  transition: filter 0.4s ease, opacity 0.4s ease, transform 0.4s ease;
}

.aigc-grid.is-unfocused .aigc-disc:hover,
.aigc-grid.is-unfocused .aigc-disc:focus-visible,
.aigc-grid.is-unfocused .aigc-disc.is-selected {
  filter: none;
  opacity: 1;
  transform: scale(1);
}

.aigc-disc {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
  padding: 14px;
  border-radius: var(--radius-m);
  border: 1px solid var(--glass-border);
  background: var(--bg-elevated);
  text-align: left;
  transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
}

/* 鼠标移上去:整张卡片抬起来 + 往右微微转个角度(见 JSX 里的
   whileHover),这里再配一圈跟着变大的阴影,让它看起来像悬浮在
   桌面上方一样 */
.aigc-disc:hover,
.aigc-disc:focus-visible {
  border-color: rgba(255, 90, 60, 0.5);
  box-shadow: 0 30px 46px -20px rgba(255, 60, 32, 0.5), 0 16px 30px -14px rgba(0, 0, 0, 0.6);
}

.aigc-disc.is-selected {
  border-color: var(--red);
  background: linear-gradient(160deg, rgba(255, 60, 32, 0.14), var(--bg-elevated) 60%);
  box-shadow: 0 0 0 1px var(--red), 0 12px 40px -10px rgba(255, 60, 32, 0.55);
}

.aigc-disc-case {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 1306 / 1204;
  border-radius: var(--radius-s);
  overflow: hidden;
}

.aigc-disc-case-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.aigc-disc-spin {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform-origin: 50% 50%;
}

.aigc-disc-id {
  color: var(--red);
  letter-spacing: 0.16em;
}

.aigc-disc-info {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  min-width: 0;
}

.aigc-disc-title {
  min-width: 0;
  flex: 1;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 13px;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.aigc-disc-duration {
  flex-shrink: 0;
  color: var(--text-faint);
}

.aigc-disc-tags {
  min-width: 0;
  color: var(--text-faint);
  font-size: 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---- 右边:播放器面板 ---- */
.aigc-player {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 20px;
  position: sticky;
  top: 110px;
}

/* ---- 放大居中模式:播放器跳出原来的位置,固定在整个网页正中间、
   明显放大;用 inset:0 + margin:auto 让它自己居中,不用 transform,
   这样跟 framer-motion 自己算的位移动画不会打架,滑过去更顺滑。 ---- */
.aigc-player.is-expanded {
  position: fixed;
  inset: 0;
  margin: auto;
  /* 之前放大后还是太小,视频画面几乎没什么变化——现在整体宽度
     差不多翻倍,让视频画面(跟播放器宽度等比)明显变大。 */
  width: min(1440px, 96vw);
  max-height: 94vh;
  padding: 30px;
  gap: 20px;
  overflow-y: auto;
  z-index: 200;
  box-shadow: 0 50px 140px -24px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.08);
}

.aigc-expand-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(4, 4, 5, 0.82);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 150;
}

.aigc-player-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.aigc-player-tags {
  color: var(--red);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.aigc-player-screen-wrap {
  position: relative;
}

.aigc-player-screen {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 16 / 10;
  border-radius: var(--radius-s);
  overflow: hidden;
  border: 1px solid var(--glass-border);
  background: var(--bg-soft);
  padding: 0;
}

/* 播放画面右上角的"放大"按钮,平时半透明的一个深色圆角小方块,
   鼠标移上去才完全显现,风格跟播放器其它图标按钮统一(细线条)。 */
.aigc-expand-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  background: rgba(6, 6, 7, 0.55);
  color: var(--text);
  opacity: 0.75;
  transition: opacity 0.25s ease, background 0.25s ease, border-color 0.25s ease;
}

.aigc-expand-btn svg {
  width: 16px;
  height: 16px;
}

.aigc-expand-btn:hover,
.aigc-expand-btn:focus-visible {
  opacity: 1;
  background: var(--red);
  border-color: var(--red);
}

.aigc-player-screen img,
.aigc-player-screen video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  background: #070708;
  display: block;
}

.aigc-player-playhint {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(6, 6, 7, 0.35);
}

.aigc-play-triangle {
  width: 0;
  height: 0;
  border-top: 13px solid transparent;
  border-bottom: 13px solid transparent;
  border-left: 20px solid var(--white);
  margin-left: 4px;
  filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
}

/* ---- 播放器"控制台":进度条 + 播放按钮 + 音量,做成一整块独立的深色面板 ---- */
.aigc-player-deck {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 16px 18px 18px;
  border-radius: var(--radius-m);
  background: var(--bg-soft);
  border: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03), 0 10px 30px -18px rgba(0, 0, 0, 0.6);
}

.aigc-scrub-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.aigc-scrub-time {
  flex-shrink: 0;
  width: 34px;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.aigc-scrub-time-remaining {
  width: auto;
  text-align: right;
}

/* 原生 range 输入,自己画滑轨 + 发光小圆点,兼容 webkit / firefox */
.aigc-scrub-input,
.aigc-volume-input {
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  height: 4px;
  border-radius: 999px;
  background: linear-gradient(
    to right,
    var(--red) 0%,
    var(--red) var(--pct, 0%),
    var(--glass-border) var(--pct, 0%),
    var(--glass-border) 100%
  );
  outline: none;
  cursor: pointer;
}

.aigc-scrub-input::-webkit-slider-thumb,
.aigc-volume-input::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 8px 1px rgba(255, 60, 32, 0.7);
  border: 2px solid var(--white);
  transition: transform 0.15s ease;
}

.aigc-scrub-input:hover::-webkit-slider-thumb,
.aigc-volume-input:hover::-webkit-slider-thumb {
  transform: scale(1.15);
}

.aigc-scrub-input::-moz-range-thumb,
.aigc-volume-input::-moz-range-thumb {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--red);
  border: 2px solid var(--white);
  box-shadow: 0 0 8px 1px rgba(255, 60, 32, 0.7);
}

.aigc-scrub-input::-moz-range-track,
.aigc-volume-input::-moz-range-track {
  height: 4px;
  border-radius: 999px;
  background: transparent;
}

.aigc-player-buttons {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 22px;
}

.aigc-player-buttons button,
.aigc-icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  padding: 6px;
  color: var(--text-dim);
}

.aigc-player-toggle {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--red) !important;
  color: var(--white) !important;
  box-shadow: 0 8px 24px -8px rgba(255, 60, 32, 0.65);
}

.aigc-volume-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.aigc-volume-row .aigc-volume-input {
  flex: 1;
}

.aigc-icon-play,
.aigc-icon-pause,
.aigc-icon-prev,
.aigc-icon-next {
  display: block;
  position: relative;
  width: 12px;
  height: 12px;
}

.aigc-icon-play {
  width: 0;
  height: 0;
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
  border-left: 11px solid currentColor;
  margin-left: 2px;
}

.aigc-icon-pause::before,
.aigc-icon-pause::after {
  content: "";
  position: absolute;
  top: 0;
  width: 3px;
  height: 13px;
  background: currentColor;
}
.aigc-icon-pause::before { left: 2px; }
.aigc-icon-pause::after { right: 2px; }

.aigc-icon-prev,
.aigc-icon-next {
  width: 0;
  height: 0;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}
.aigc-icon-prev {
  border-right: 9px solid currentColor;
}
.aigc-icon-next {
  border-left: 9px solid currentColor;
}

/* 音量按钮上的小喇叭图标(纯 CSS 画的,不用图片) */
.aigc-icon-speaker {
  position: relative;
  display: block;
  width: 12px;
  height: 12px;
  background: currentColor;
  clip-path: polygon(0% 32%, 35% 32%, 62% 6%, 62% 94%, 35% 68%, 0% 68%);
}

.aigc-icon-speaker--loud::after {
  content: "";
  position: absolute;
  left: 100%;
  top: 50%;
  width: 9px;
  height: 9px;
  margin-left: 2px;
  border: 1.6px solid currentColor;
  border-radius: 50%;
  clip-path: inset(0 0 0 50%);
  transform: translateY(-50%);
  opacity: 0.85;
}

.aigc-player-volume {
  flex-shrink: 0;
  letter-spacing: 0.1em;
}

.aigc-player-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--glass-border);
  flex-wrap: wrap;
}

.aigc-player-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  color: var(--text);
}

.aigc-player-subtags {
  margin-top: 4px;
}

.aigc-player-cta {
  flex-shrink: 0;
  padding: 12px 20px;
  font-size: 12px;
}

@media (max-width: 1100px) {
  .aigc-player {
    position: static;
  }
}

/* ---- 底部一行小字 ---- */
.aigc-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: 28px;
  padding-top: 24px;
  border-top: 1px solid var(--glass-border);
  flex-wrap: wrap;
  opacity: 0.55;
}

@media (max-width: 700px) {
  .aigc-footer {
    justify-content: flex-start;
  }
  .aigc-footer span:nth-child(3) {
    display: none;
  }
}


/* src/components/BrandGrid.css */
/* ------------------------------------------------------------
   档案式浏览板块:左边一列可以往下滑的档案列表(缩略图 + 标题),
   右边直接显示当前选中这份企划的内容,不用再点开弹窗看。
   ------------------------------------------------------------ */
.brand-archive {
  margin-top: 48px;
  display: flex;
  align-items: stretch;
  aspect-ratio: 16 / 9;
  border-radius: var(--radius-m);
  overflow: hidden;
}

/* -------------------- 左边:档案列表 -------------------- */
.brand-archive-list {
  flex: 0 0 320px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid var(--glass-border);
}

.brand-archive-list-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 18px;
  border-bottom: 1px solid var(--glass-border);
}

.brand-archive-rows {
  flex: 1 1 auto;
  overflow-y: auto;
}

.brand-archive-row {
  all: unset;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px 18px;
  cursor: pointer;
  border-bottom: 1px solid var(--glass-border);
  border-left: 3px solid transparent;
  transition: background 0.2s ease, border-color 0.2s ease;
}

.brand-archive-row:hover {
  background: rgba(255, 255, 255, 0.04);
}

.brand-archive-row.is-active {
  background: rgba(255, 60, 32, 0.1);
  border-left-color: var(--red);
}

.brand-archive-row-index {
  flex: 0 0 auto;
  width: 20px;
  color: var(--text-dim);
}

.brand-archive-row.is-active .brand-archive-row-index {
  color: var(--red);
}

.brand-archive-row-thumb {
  flex: 0 0 auto;
  width: 52px;
  height: 52px;
  border-radius: var(--radius-s);
  overflow: hidden;
  background: var(--bg-elevated);
}

.brand-archive-row-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.brand-archive-row-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.brand-archive-row-title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brand-archive-row.is-active .brand-archive-row-title {
  color: var(--red);
}

.brand-archive-row-sub {
  font-size: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* -------------------- 右边:当前企划内容 -------------------- */
.brand-archive-main {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}

.brand-archive-main-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--glass-border);
}

.brand-archive-live {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--red);
}

.brand-archive-live .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 10px 2px rgba(255, 60, 32, 0.8);
}

.brand-archive-nav {
  display: flex;
  gap: 8px;
}

.brand-archive-nav button {
  all: unset;
  cursor: pointer;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--glass-border);
  color: var(--text-dim);
  transition: border-color 0.2s ease, color 0.2s ease;
}

.brand-archive-nav button:hover,
.brand-archive-nav button:focus-visible {
  border-color: var(--red);
  color: var(--white);
}

/* 真正滚动的地方:里面是整份企划从头拼到尾的长图 */
.brand-archive-main-body {
  flex: 1 1 auto;
  overflow-y: auto;
  background: #0a0a0b;
}

.brand-archive-main-body img {
  display: block;
  width: 100%;
  height: auto;
}

.brand-archive-main-foot {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 20px;
  border-top: 1px solid var(--glass-border);
}

.brand-archive-main-foot h3 {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 800;
  text-transform: uppercase;
}

@media (max-width: 900px) {
  .brand-archive {
    flex-direction: column;
    aspect-ratio: auto;
    height: auto;
  }

  .brand-archive-list {
    flex: 0 0 auto;
    max-height: 280px;
    border-right: none;
    border-bottom: 1px solid var(--glass-border);
  }

  .brand-archive-main-body {
    height: 420px;
  }

  .brand-archive-main-foot {
    flex-wrap: wrap;
  }
}

@media (max-width: 560px) {
  .brand-archive-main-head {
    padding: 12px 14px;
  }

  .brand-archive-row {
    padding: 10px 14px;
  }

  .brand-archive-main-foot {
    padding: 12px 14px;
  }
}

.brand-archive-main-body video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #050506;
}

.brand-archive-description {
  margin-left: auto;
  max-width: 44%;
  color: var(--text-dim);
  font-size: 11px;
  line-height: 1.55;
}

@media (max-width: 900px) {
  .brand-archive-description {
    width: 100%;
    max-width: none;
    margin-left: 0;
  }
}


/* src/components/CardSwap.css */
/* React Bits CardSwap 组件自带的样式,基本保持原样——
   容器默认贴在"父级容器"的右下角、带一点透视 3D 倾斜。
   用的地方(CharacterBuild.css 里)会给一个固定宽高、
   position:relative 的外层盒子把它包住,效果就是卡片
   一张一张从这个盒子的右下角堆叠着轮播。 */
.card-swap-container {
  position: absolute;
  bottom: 0;
  right: 0;
  transform: translate(5%, 20%);
  transform-origin: bottom right;

  perspective: 900px;
  overflow: visible;
}

.card {
  position: absolute;
  top: 50%;
  left: 50%;
  border-radius: 12px;
  border: 1px solid #fff;
  background: #000;

  transform-style: preserve-3d;
  will-change: transform;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

@media (max-width: 768px) {
  .card-swap-container {
    transform: scale(0.75) translate(25%, 25%);
  }
}

@media (max-width: 480px) {
  .card-swap-container {
    transform: scale(0.55) translate(25%, 25%);
  }
}


/* src/components/CharacterBuild.css */
.character-tag {
  margin-top: 18px;
  margin-bottom: 44px;
}

/* ---- 一整行横向卡片 + 左右滑动箭头 ---- */
.character-row-wrap {
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.character-row {
  display: flex;
  align-items: flex-start;
  gap: 20px;
  overflow-x: auto;
  /* 改成 mandatory:每次滑动都干脆利落地停在整张卡片上,
     不会停在两张卡片中间,滑起来才利索。 */
  scroll-snap-type: x mandatory;
  /* 上下多留一点空间,不然卡片被点击/选中时的轻微放大效果
     会被这个容器的滚动裁切边缘"切掉一半"。 */
  padding: 14px 4px 18px;
  margin: -14px -4px -18px;
  /* 隐藏滚动条,视觉上完全靠下面那对箭头按钮来滑动 */
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.character-row::-webkit-scrollbar {
  display: none;
}

/* 卡片本身现在是一个 <button>,这里先把默认按钮样式清掉 */
.character-card {
  all: unset;
  font: inherit;
  color: inherit;
  box-sizing: border-box;
  flex: 0 0 200px;
  width: 200px;
  scroll-snap-align: start;
  display: flex;
  flex-direction: column;
  gap: 10px;
  cursor: pointer;
  border-radius: var(--radius-s);
}

.character-card:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 4px;
}

/* 顶部胶囊:现在写的是角色名字(不再是编号),点整张卡都能打开详情页 */
.character-card-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  padding: 9px 12px;
  border-radius: 999px;
  border: 1px solid var(--red);
  background: rgba(255, 60, 32, 0.16);
  backdrop-filter: blur(2px);
  color: var(--white);
  box-shadow: 0 0 22px -8px rgba(255, 60, 32, 0.9);
  transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
}

.character-card-topname {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--white);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.character-card-topbar svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

.character-card:hover .character-card-topbar,
.character-card:focus-visible .character-card-topbar {
  background: var(--red);
  box-shadow: 0 0 30px -6px rgba(255, 60, 32, 1);
  transform: translateY(-1px);
}

/* 封面立绘,四角带一圈发光取景框 */
.character-card-cover {
  position: relative;
  aspect-ratio: 3 / 4;
  border-radius: var(--radius-s);
  overflow: hidden;
  background-color: var(--bg-elevated);
  background-size: cover;
  background-position: center;
  border: 1px solid var(--glass-border);
}

.frame-corner {
  position: absolute;
  width: 20px;
  height: 20px;
  pointer-events: none;
  z-index: 2;
  filter: drop-shadow(0 0 6px rgba(255, 60, 32, 0.85)) drop-shadow(0 0 14px rgba(255, 60, 32, 0.4));
}

.frame-corner.tl { top: 8px; left: 8px; border-top: 2px solid var(--red); border-left: 2px solid var(--red); border-radius: 4px 0 0 0; }
.frame-corner.tr { top: 8px; right: 8px; border-top: 2px solid var(--red); border-right: 2px solid var(--red); border-radius: 0 4px 0 0; }
.frame-corner.bl { bottom: 8px; left: 8px; border-bottom: 2px solid var(--red); border-left: 2px solid var(--red); border-radius: 0 0 0 4px; }
.frame-corner.br { bottom: 8px; right: 8px; border-bottom: 2px solid var(--red); border-right: 2px solid var(--red); border-radius: 0 0 4px 0; }

/* 底部信息条:编号 + 中文名,字号比顶部小,不抢主要视觉 */
.character-card-bottombar {
  display: flex;
  align-items: baseline;
  gap: 8px;
  width: 100%;
  padding: 7px 12px;
  border-radius: var(--radius-s);
  border: 1px solid rgba(255, 90, 60, 0.5);
  background: rgba(255, 60, 32, 0.06);
  box-shadow: 0 0 16px -10px rgba(255, 60, 32, 0.7);
}

.character-card-bottombar .mono-label {
  color: var(--text-dim);
  font-size: 10px;
}

.character-card-name-cn {
  font-size: 12px;
  color: var(--text);
}

/* 左右滑动箭头,放在整行卡片下面居中 */
.character-row-nav {
  display: flex;
  gap: 14px;
  justify-content: center;
}

.character-nav-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 999px;
  border: 1px solid var(--red);
  background: rgba(255, 60, 32, 0.1);
  color: var(--white);
  cursor: pointer;
  transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
}

.character-nav-btn svg {
  width: 16px;
  height: 16px;
}

.character-nav-btn.is-right svg {
  transform: scaleX(-1);
}

.character-nav-btn:hover,
.character-nav-btn:focus-visible {
  background: var(--red);
  box-shadow: 0 0 24px -6px rgba(255, 60, 32, 0.9);
  transform: translateY(-1px);
}

.character-footer {
  display: flex;
  gap: 18px;
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid var(--glass-border);
  opacity: 0.55;
  flex-wrap: wrap;
}

/* ------------------------------------------------------------
   详情页(点卡片弹出的独立页面,不再是原地展开)
   左边小封面缩略图 + 中间大图 + 右边三张可点的插卡,
   三张插卡和中间大图都放在白底卡片上,跟站点整体深色背景形成对比,
   照片本身背景偏浅灰/白,贴在白卡上不会显得突兀。
   ------------------------------------------------------------ */
.character-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(6, 6, 7, 0.86);
  backdrop-filter: blur(6px);
}

.character-modal {
  position: relative;
  width: 100%;
  max-width: 980px;
  max-height: 92vh;
  overflow-y: auto;
  padding: 32px;
  border-radius: var(--radius-s);
  border: 1px solid var(--red);
  background: var(--bg-elevated);
  box-shadow: 0 0 60px -16px rgba(255, 60, 32, 0.55), 0 30px 70px -20px rgba(0, 0, 0, 0.8);
}

.character-modal-close {
  position: absolute;
  top: 18px;
  right: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 999px;
  border: 1px solid var(--red);
  background: rgba(255, 60, 32, 0.12);
  color: var(--white);
  cursor: pointer;
  transition: background 0.2s ease, transform 0.2s ease;
  z-index: 3;
}

.character-modal-close svg {
  width: 14px;
  height: 14px;
}

.character-modal-close:hover,
.character-modal-close:focus-visible {
  background: var(--red);
  transform: rotate(90deg);
}

.character-modal-inner {
  display: flex;
  align-items: flex-start;
  gap: 22px;
  flex-wrap: wrap;
}

/* 左边一整列:上面是封面缩略图身份卡,下面(如果这个角色有转盘素材)
   多一张可以点的视频卡,点了它中间大图就切成转盘视频。 */
.character-modal-left {
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 0 0 150px;
  width: 150px;
}

/* 左边:小封面缩略图,当作这份档案的"身份卡"——现在也是一颗可以点的
   按钮,点了中间大图就切换显示这张形象照,选中时跟其它卡片一样发光。 */
.character-modal-thumb {
  all: unset;
  font: inherit;
  color: inherit;
  box-sizing: border-box;
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  border-radius: var(--radius-s);
  overflow: hidden;
  border: 1px solid var(--red);
  background: #fff;
  cursor: pointer;
  box-shadow: 0 0 24px -10px rgba(255, 60, 32, 0.7);
  transition: box-shadow 0.2s ease, transform 0.2s ease;
}

.character-modal-thumb:hover {
  transform: translateY(-2px);
}

.character-modal-thumb.is-active {
  box-shadow: 0 0 0 2px var(--red), 0 14px 26px -12px rgba(255, 60, 32, 0.9);
}

.character-modal-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.character-modal-thumb-label {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 8px 10px;
  background: linear-gradient(to top, rgba(6, 6, 7, 0.88), rgba(6, 6, 7, 0));
  color: var(--white);
}

.character-modal-thumb-label .mono-label {
  font-size: 9px;
  opacity: 0.7;
}

.character-modal-thumb-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.03em;
}

.character-modal-thumb-label .character-card-name-cn {
  font-size: 10px;
  color: rgba(255, 255, 255, 0.75);
}

/* 左下角:转盘视频卡,长得跟上面的身份卡差不多高,但海报图上叠一个
   "360°"角标,提示这张是可以转动查看的视频,不是普通照片。 */
.character-modal-video-thumb {
  all: unset;
  font: inherit;
  color: inherit;
  box-sizing: border-box;
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  border-radius: var(--radius-s);
  overflow: hidden;
  border: 1px solid rgba(255, 90, 60, 0.5);
  background: #fff;
  cursor: pointer;
  box-shadow: 0 0 18px -12px rgba(255, 60, 32, 0.7);
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.character-modal-video-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  opacity: 0.9;
}

.character-modal-video-thumb-badge,
.character-video-thumb-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 3px 7px;
  border-radius: 999px;
  background: rgba(255, 60, 32, 0.92);
  color: var(--white);
  font-family: var(--font-display);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.02em;
  box-shadow: 0 0 12px -4px rgba(255, 60, 32, 0.9);
}

.character-video-thumb-badge svg {
  width: 10px;
  height: 10px;
}

.character-video-thumb-label {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 6px 8px;
  font-size: 8px;
  letter-spacing: 0.03em;
  text-align: center;
  color: var(--white);
  background: linear-gradient(to top, rgba(6, 6, 7, 0.82), rgba(6, 6, 7, 0));
}

.character-modal-video-thumb:hover {
  transform: translateY(-2px) scale(1.02);
}

.character-modal-video-thumb.is-active {
  border-color: var(--red);
  box-shadow: 0 0 0 2px var(--red), 0 14px 26px -12px rgba(255, 60, 32, 0.9);
}

/* 中间大图这一整列:上面是照片/视频显示框,下面(视频模式时)多一条
   拖动滑轨,滑轨永远紧跟在大图下方,不会跑到右边插卡那一列去。 */
.character-modal-main-col {
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex: 1 1 320px;
  min-width: 220px;
  max-width: 460px;
}

/* 中间:当前选中的三视图大图(或转盘视频),放在白底卡片上,
   底部标注正面/侧面/背面,或者视频模式下提示"拖动旋转"。 */
.character-modal-main {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  border-radius: var(--radius-s);
  overflow: hidden;
  border: 1px solid rgba(255, 90, 60, 0.6);
  background: #fff;
  box-shadow: 0 0 34px -10px rgba(255, 60, 32, 0.6), 0 20px 46px -18px rgba(0, 0, 0, 0.6);
}

.character-modal-main img,
.character-modal-main video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
  animation: character-main-fade 0.25s ease;
}

@keyframes character-main-fade {
  from { opacity: 0.3; transform: scale(1.015); }
  to { opacity: 1; transform: scale(1); }
}

/* 大图下面的拖动滑轨:左右拖动手柄,视频就跳到对应的那一帧,
   松手也不会自己播放——靠这个"手动擦洗"做出转动 3D 模型的感觉。 */
.character-scrub-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.character-scrub-rail {
  position: relative;
  width: 100%;
  height: 28px;
  display: flex;
  align-items: center;
  cursor: grab;
  touch-action: none;
}

.character-scrub-rail:active {
  cursor: grabbing;
}

.character-scrub-track {
  position: relative;
  width: 100%;
  height: 4px;
  border-radius: 999px;
  background: rgba(255, 90, 60, 0.18);
  overflow: hidden;
}

.character-scrub-fill {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  background: var(--red);
  border-radius: 999px;
}

.character-scrub-handle {
  position: absolute;
  top: 50%;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  background: var(--red);
  border: 2px solid var(--white);
  box-shadow: 0 0 14px -3px rgba(255, 60, 32, 0.9);
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.character-scrub-hint {
  font-size: 9px;
  letter-spacing: 0.03em;
  color: var(--text-dim);
  opacity: 0.75;
  text-align: center;
}

/* 右边:三张可以点的插卡(正面/侧面/背面),点哪张中间大图就切成哪张 */
.character-modal-stack {
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 0 0 110px;
  width: 110px;
}

.character-modal-stack-card {
  all: unset;
  font: inherit;
  color: inherit;
  box-sizing: border-box;
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  aspect-ratio: 3 / 4;
  border-radius: var(--radius-s);
  overflow: hidden;
  background: #fff;
  border: 1px solid rgba(0, 0, 0, 0.12);
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.character-modal-stack-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.character-modal-stack-card span.mono-label {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 4px 6px;
  font-size: 8px;
  letter-spacing: 0.04em;
  text-align: center;
  color: var(--white);
  background: rgba(6, 6, 7, 0.65);
}

.character-modal-stack-card:hover {
  transform: translateX(-3px) scale(1.03);
}

/* 选中的那一张:轻微放大 + 往左抬一点 + 发光描边,一眼看出选的是哪张 */
.character-modal-stack-card.is-active {
  border-color: var(--red);
  transform: translateX(-6px) scale(1.07);
  box-shadow: 0 0 0 2px var(--red), 0 14px 26px -12px rgba(255, 60, 32, 0.9);
  z-index: 1;
}

.character-modal-desc {
  margin-top: 22px;
  color: var(--text-dim);
  font-size: 13px;
  line-height: 1.6;
  max-width: 60ch;
}

/* 通用的小标签(白底图片上叠一个深色小胶囊,用来写"正面/FRONT"这种标注) */
.character-view-tag {
  position: absolute;
  left: 10px;
  bottom: 10px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 6, 7, 0.72);
  color: var(--white);
  font-size: 10px;
  letter-spacing: 0.08em;
  backdrop-filter: blur(4px);
}

/* 手机宽度下,详情页改成"从上到下"一整列:大图在最上面最显眼,
   下面依次是"身份卡+转盘视频"一排、"正面/侧面/背面"一排,
   每一排里的卡片都用 flex:1 平分整行宽度,不会再出现某一排
   只占一小块、右边空出一大块的情况。用 order 控制顺序,
   跟 HTML 里原本的书写顺序(左栏在前)无关。 */
@media (max-width: 720px) {
  .character-card {
    flex-basis: 160px;
    width: 160px;
  }

  .character-modal {
    padding: 22px 18px;
  }

  .character-modal-inner {
    gap: 12px;
  }

  /* 大图排最上面 */
  .character-modal-main-col {
    order: 1;
    flex: 1 1 100%;
    width: 100%;
    max-width: 100%;
  }

  /* 身份卡 + 转盘视频卡,并排一行,各占一半 */
  .character-modal-left {
    order: 2;
    flex-direction: row;
    flex: 1 1 100%;
    width: 100%;
    gap: 12px;
  }

  .character-modal-thumb,
  .character-modal-video-thumb {
    flex: 1 1 0;
    width: auto;
  }

  /* 正面/侧面/背面,并排一行,各占三分之一 */
  .character-modal-stack {
    order: 3;
    flex-direction: row;
    flex: 1 1 100%;
    width: 100%;
    gap: 12px;
  }

  .character-modal-stack-card {
    flex: 1 1 0;
  }

  .character-modal-stack-card:hover {
    transform: translateY(-4px) scale(1.03);
  }

  .character-modal-stack-card.is-active {
    transform: translateY(-6px) scale(1.07);
  }
}


/* src/components/FashionCardCarousel.css */
.fashion-card-carousel {
  --fashion-card-width: clamp(250px, 25vw, 390px);
  position: relative;
  margin-top: 28px;
}

.fashion-card-stage {
  position: relative;
  height: clamp(430px, 47vw, 630px);
  overflow: hidden;
  outline: none;
  isolation: isolate;
  perspective: 1500px;
  touch-action: pan-y;
}

.fashion-card-stage:focus-visible {
  outline: 1px solid var(--red);
  outline-offset: 8px;
  border-radius: 22px;
}

.fashion-card-stage__halo {
  position: absolute;
  left: 50%;
  bottom: 3.5%;
  width: min(660px, 58vw);
  height: 1px;
  translate: -50% 0;
  background: rgba(255, 60, 32, 0.72);
  box-shadow: 0 0 48px 18px rgba(255, 60, 32, 0.19);
  pointer-events: none;
}

.fashion-card-stage__perspective {
  position: absolute;
  inset: 0;
  pointer-events: none;
  transform-style: preserve-3d;
}

.fashion-showcase-card {
  appearance: none;
  position: absolute;
  top: 50%;
  left: 50%;
  width: var(--fashion-card-width);
  aspect-ratio: 3 / 4;
  translate: -50% -50%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: clamp(9px, 1vw, 14px);
  padding: clamp(12px, 1.15vw, 18px);
  overflow: hidden;
  color: var(--text);
  text-align: left;
  background: #151517;
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: clamp(16px, 1.55vw, 24px);
  box-shadow:
    0 30px 70px -34px rgba(0, 0, 0, 0.95),
    inset 0 0 0 1px rgba(255, 255, 255, 0.035);
  transform-style: preserve-3d;
  transform-origin: center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  will-change: transform, opacity, filter;
  pointer-events: auto;
}

.fashion-showcase-card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.6);
  pointer-events: none;
}

.fashion-showcase-card.is-active {
  border-color: var(--red);
  cursor: grab;
  box-shadow:
    0 0 0 1px var(--red),
    0 42px 80px -34px rgba(255, 60, 32, 0.55),
    inset 0 0 0 1px rgba(255, 255, 255, 0.06);
}

.fashion-showcase-card.is-active:active {
  cursor: grabbing;
}

.fashion-showcase-card:focus-visible {
  outline: 2px solid var(--text);
  outline-offset: 5px;
}

.fashion-showcase-card__topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: rgba(244, 243, 239, 0.6);
  font-size: clamp(8px, 0.65vw, 10px);
  white-space: nowrap;
}

.fashion-showcase-card__image-frame {
  display: grid;
  place-items: center;
  min-height: 0;
  padding: clamp(11px, 1.2vw, 18px);
  overflow: hidden;
  background: #fff;
  border: 1px solid rgba(255, 255, 255, 0.86);
  border-radius: clamp(9px, 0.8vw, 13px);
}

.fashion-showcase-card__image-frame img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  background: #fff;
  user-select: none;
  -webkit-user-drag: none;
}

.fashion-showcase-card__image-frame img.is-cropped {
  object-fit: cover;
}

.fashion-showcase-card__caption {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas:
    "title action"
    "cn action";
  column-gap: 14px;
  min-width: 0;
  padding: 2px 2px 1px;
}

.fashion-showcase-card__title {
  grid-area: title;
  display: -webkit-box;
  min-width: 0;
  overflow: hidden;
  font-family: var(--font-mono);
  font-size: clamp(10px, 0.78vw, 13px);
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: 0.04em;
  white-space: normal;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.fashion-showcase-card__title-cn {
  grid-area: cn;
  min-width: 0;
  margin-top: 3px;
  overflow: hidden;
  color: var(--text-dim);
  font-size: clamp(9px, 0.72vw, 12px);
  line-height: 1.35;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.fashion-showcase-card__action {
  grid-area: action;
  align-self: end;
  color: var(--red);
  font-size: clamp(7px, 0.56vw, 9px);
  white-space: nowrap;
}

.fashion-carousel-controls {
  display: grid;
  grid-template-columns: minmax(150px, 1fr) auto minmax(150px, 1fr);
  align-items: center;
  gap: clamp(14px, 3vw, 42px);
  width: min(820px, 82%);
  margin: 18px auto 0;
}

.fashion-carousel-step {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 48px;
  padding: 0 24px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  background: #171719;
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 999px;
  transition:
    color 180ms ease,
    background-color 180ms ease,
    border-color 180ms ease,
    transform 180ms ease;
}

.fashion-carousel-step:hover,
.fashion-carousel-step:focus-visible {
  color: #fff;
  background: var(--red);
  border-color: var(--red);
  transform: translateY(-2px);
  outline: none;
}

.fashion-carousel-status {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-width: 116px;
  text-align: center;
}

.fashion-carousel-status__count {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.fashion-carousel-status__count > span {
  color: var(--text-faint);
  font-size: 12px;
}

.fashion-carousel-status__hint {
  color: var(--text-faint);
  font-size: 8px;
  white-space: nowrap;
}

@media (max-width: 900px) {
  .fashion-card-carousel {
    --fashion-card-width: clamp(252px, 43vw, 340px);
  }

  .fashion-card-stage {
    height: clamp(420px, 64vw, 545px);
  }

  .fashion-carousel-controls {
    width: min(700px, 92%);
  }
}

@media (max-width: 600px) {
  .fashion-card-carousel {
    --fashion-card-width: min(72vw, 286px);
    margin-top: 18px;
  }

  .fashion-card-stage {
    height: min(102vw, 430px);
    margin-inline: calc(var(--gutter) * -1);
  }

  .fashion-card-stage__halo {
    width: 68vw;
    bottom: 4%;
  }

  .fashion-showcase-card {
    gap: 8px;
    padding: 10px;
    border-radius: 16px;
  }

  .fashion-showcase-card__image-frame {
    padding: 9px;
    border-radius: 9px;
  }

  .fashion-showcase-card__caption {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas:
      "title"
      "cn";
  }

  .fashion-showcase-card__action {
    display: none;
  }

  .fashion-carousel-controls {
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    width: 100%;
    margin-top: 12px;
  }

  .fashion-carousel-step {
    gap: 7px;
    min-height: 42px;
    padding: 0 12px;
    font-size: 8px;
  }

  .fashion-carousel-status {
    min-width: 84px;
  }

  .fashion-carousel-status__hint {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .fashion-carousel-step {
    transition: none;
  }
}


/* src/components/FashionDetail.css */
/* 服装作品详情页:左边文字说明 + 竖排缩略图,右边大图 + 左右箭头 */
.fashion-detail-backdrop {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(6, 6, 7, 0.86);
  backdrop-filter: blur(6px);
}

.fashion-detail {
  position: relative;
  width: fit-content;
  max-width: 96vw;
  max-height: 92vh;
  overflow-y: auto;
  padding: 30px;
  border-radius: var(--radius-s);
  border: 1px solid var(--red);
  background: var(--bg-elevated);
  box-shadow: 0 0 60px -16px rgba(255, 60, 32, 0.55), 0 30px 70px -20px rgba(0, 0, 0, 0.8);
}

.fashion-detail-close {
  all: unset;
  position: absolute;
  top: 18px;
  right: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 999px;
  border: 1px solid var(--red);
  background: rgba(255, 60, 32, 0.12);
  color: var(--white);
  cursor: pointer;
  font-size: 13px;
  transition: background 0.2s ease, transform 0.2s ease;
  z-index: 3;
}

.fashion-detail-close:hover {
  background: var(--red);
  transform: rotate(90deg);
}

/* 左边说明文字 + 缩略图,右边大图,左右各占一半重量 */
.fashion-detail-inner {
  display: flex;
  align-items: stretch;
  gap: 16px;
  height: min(70vh, 720px);
}

/* 缩略图旁边的一条竖轨道,呼应整站的红色强调线 */
.fashion-detail-rail {
  flex: 0 0 4px;
  align-self: stretch;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--red), rgba(255, 60, 32, 0.3));
  box-shadow: 0 0 12px rgba(255, 60, 32, 0.65);
}

.fashion-detail-side {
  flex: 0 0 250px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
  min-height: 0;
}

.fashion-detail-head {
  padding-right: 34px;
}

.fashion-detail-plate {
  color: var(--text-dim);
  opacity: 0.8;
}

.fashion-detail-title {
  margin: 6px 0 4px;
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.01em;
  color: var(--white);
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 10px;
}

.fashion-detail-title .cjk {
  font-size: 13px;
  font-weight: 400;
  color: var(--text-dim);
}

.fashion-detail-tag {
  color: var(--text-dim);
  opacity: 0.7;
}

/* 竖着排的缩略图(含封面),填满说明文字下方剩下的高度 */
.fashion-detail-strip {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 0;
  overflow-y: auto;
  padding: 2px 4px 2px 2px;
  scrollbar-width: none;
}

.fashion-detail-strip::-webkit-scrollbar {
  display: none;
}

.fashion-detail-thumb {
  all: unset;
  box-sizing: border-box;
  flex: 0 0 auto;
  width: 100%;
  aspect-ratio: 3 / 4;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.15);
  cursor: pointer;
  opacity: 0.6;
  transition: opacity 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
}

.fashion-detail-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.fashion-detail-thumb:hover {
  opacity: 0.9;
}

.fashion-detail-thumb.is-active {
  opacity: 1;
  border-color: var(--red);
  transform: translateX(3px);
  box-shadow: 0 6px 16px -8px rgba(255, 60, 32, 0.9);
}

/* 右边:大图,尺寸固定,始终保持竖版 3:4,只有图片内容会换 */
.fashion-detail-main {
  position: relative;
  flex: 0 0 auto;
  height: min(70vh, 720px);
  width: auto;
  aspect-ratio: 3 / 4;
  border-radius: var(--radius-s);
  overflow: hidden;
  border: 1px solid rgba(255, 90, 60, 0.6);
  background: #fff;
  box-shadow: 0 0 34px -10px rgba(255, 60, 32, 0.6), 0 20px 46px -18px rgba(0, 0, 0, 0.6);
}

.fashion-detail-main img {
  width: 100%;

/* ---- 整个模块的深色氛围背景,叠加你发的那张"工作室桌面"插画做背景图 ---- */
.directory-section {

    radial-gradient(ellipse at 20% 0%, rgba(255, 60, 32, 0.12), transparent 55%),
    radial-gradient(ellipse at 100% 100%, rgba(255, 255, 255, 0.05), transparent 50%),
    linear-gradient(180deg, rgba(6, 6, 7, 0.94), rgba(6, 6, 7, 0.97) 55%, #060607 85%),
    var(--directory-image);

}

/* 顶部的"淡入"渐变:从跟上一个模块结尾一样的纯黑色(--bg),
   往下慢慢透明,露出这个模块自己的深红背景图——这样两个模块
   交界的地方是"慢慢变过去",不是硬邦邦一条线。 */
.directory-top-fade {

  right: 0;

/* ---- 中间:5 张票根卡片,像"一手扑克牌"一样共用一个底部支点展开成扇形 ----
   .ticket-card-slot 负责"钉在同一个支点上"(纯 CSS、不参与动画);
   .ticket-card 自己是 motion.a,水平位置/角度/缩放全部由 React 状态
   (拖动偏移 + 当前选中哪张)算出来,交给 framer-motion 做弹簧动画,
   所以是"滑过去"而不是瞬间跳过去。 */
.directory-fan {
  position: relative;
  /* 卡片是贴着这个容器的底边(见下面 .ticket-card-slot 的 bottom)
     摆放的,容器本身留得太高的话,卡片上面就会空出一大截什么都
     没有的背景——把高度和上边距都收紧一些,让卡片跟上面的标题区
     离得更近,不再空那么一大块。 */
  height: 520px;
  margin-top: 56px;
  padding-bottom: 8px;
  cursor: grab;
  touch-action: pan-y;
}

.directory-fan:active {
  cursor: grabbing;
}

.ticket-card-slot {
  position: absolute;
  left: 50%;
  /* 支点离容器底边留一点点距离就够了(不需要留三分之一那么多空
     白)——上次改成用负的 margin 硬把下面的按钮往上拉,结果按钮
     和卡片的可交互区域叠在了一起,导致拖动失灵;这次直接从根源
     缩小卡片底部本来就留的这块空白,按钮自然就没那么远了,也不会
     再跟卡片的拖拽区域重叠。 */
  bottom: 12%;
  transform: translateX(-50%);
}

/* 卡片本身就是你给的那张票根截图(item.cardImage),不再用
   代码画一遍编号/标题/标签这些内容——宽高比按截图原图的比例
   (618:1200)来定,保证不会被拉伸变形;阴影/圆角/悬停发光这些
   "卡片外面一圈"的效果还是由 CSS 来做,跟截图内容本身分开。 */
.ticket-card {
  position: relative;
  transform-origin: bottom center;
  display: block;
  width: 272px;
  aspect-ratio: 618 / 1200;
  border-radius: 24px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.16);
  /* 每张牌任何时候都要看得出"浮在深色背景上"的阴影,不是只有
     悬停才有:近处一层小范围、深一点的接触阴影负责"贴地感",
     远处一层大范围、软一点的阴影负责"悬浮感",两层叠在一起
     即使背景本身很暗,也能看出卡片跟背景是分开的两层。 */
  box-shadow:
    0 10px 18px -6px rgba(0, 0, 0, 0.55),
    0 34px 58px -18px rgba(0, 0, 0, 0.75),
    0 0 34px -6px var(--ticket-glow, rgba(255, 255, 255, 0.3));
  transition: box-shadow 0.4s ease, border-color 0.4s ease;
}

/* 票根两侧那个"挖进去的圆孔"：截图本身在这个位置已经是透明的了,
   但因为好几张票根叠在一起,透明的地方漏出来的常常是隔壁那张票
   的内容(可能是白色/亮色),看着不像"挖了个洞",倒像贴了个白点。
   干脆在这个位置正上方,自己画一个深色、带一点内凹阴影的小圆,
   不管背后叠着什么,这个洞永远看起来是"凹进去、露出桌面"的样子。
   位置/大小是按截图里那个圆孔在整张图里的实际比例换算过来的。 */
.ticket-card::before,
.ticket-card::after {
  content: "";
  position: absolute;
  top: 35.5%;
  width: 8.4%;
  aspect-ratio: 1;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle at 35% 32%, rgba(20, 14, 10, 0.55), rgba(4, 3, 3, 0.92) 75%);
  box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.65), inset 0 -1px 1px rgba(255, 255, 255, 0.06);
  pointer-events: none;
  z-index: 5;
}

.ticket-card::before {
  left: 0;
}

.ticket-card::after {
  left: 100%;
}

.ticket-card.tone-light {
  --ticket-glow: rgba(255, 255, 255, 0.4);
}

.ticket-card.tone-dark {
  --ticket-glow: rgba(255, 96, 48, 0.6);
}

.ticket-card-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 位置/角度/缩放的弹出效果由 React + framer-motion 控制(见 .jsx),
   这里只补一点辉光和描边,不碰 transform,避免跟弹簧动画打架。 */
.ticket-card:hover,
.ticket-card:focus-visible {
  border-color: rgba(255, 255, 255, 0.3);
  box-shadow:
    0 12px 20px -6px rgba(0, 0, 0, 0.6),
    0 44px 70px -18px rgba(0, 0, 0, 0.8),
    0 0 0 1px var(--ticket-glow, rgba(255, 255, 255, 0.5)),
    0 0 56px 6px var(--ticket-glow, rgba(255, 255, 255, 0.5));
}

/* 圆形数字按钮(1-5):固定不动的导航方式,鼠标悬停/选中时

.directory-fan-nav {

.directory-fan-dot {

  transition: transform 0.3s ease, background 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}

.directory-fan-dot:hover,
.directory-fan-dot:focus-visible,
.directory-fan-dot.is-active {

  border-color: var(--red);
  background: var(--red);

.directory-fan-hint {

/* src/components/FloatingDock.css */
.floating-dock {
  display: flex;
  align-items: flex-end;
  gap: 22px;
  padding: 20px 4px;
  width: fit-content;
  max-width: 100%;
  overflow-x: auto;
  overflow-y: visible;
}

.dock-icon {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
  background: linear-gradient(160deg, var(--bg-elevated), var(--bg-soft));
  border: 1px solid var(--glass-border);
  overflow: hidden;
  box-shadow: 0 10px 24px -14px rgba(0, 0, 0, 0.7);
  transition: border-color 0.2s ease;
}

.dock-icon-img {
  width: 94%;
  height: 94%;
  object-fit: contain;
  border-radius: 12px;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

/* 鼠标划过去时的一层"光泽"高光,从左上往右下扫过 */
.dock-icon::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    115deg,
    transparent 20%,
    rgba(255, 255, 255, 0.22) 45%,
    transparent 65%
  );
  transform: translateX(-120%);
  transition: transform 0.6s ease;
}

.dock-icon:hover::before {
  transform: translateX(120%);
}

.dock-icon:hover {
  border-color: rgba(255, 255, 255, 0.35);
}

.dock-tooltip {
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-bottom: 10px;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--bg-elevated);
  border: 1px solid var(--glass-border);
  color: var(--text);
  white-space: nowrap;
  font-size: 11px;
  z-index: 5;
}

@media (max-width: 960px) {
  .floating-dock {
    width: 100%;
  }
}


/* src/components/GlowCursor.css */
/* 铺满全屏、不挡点击的固定图层 —— 全站鼠标发光拖尾特效 */
.glow-cursor-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  pointer-events: none; /* 关键:鼠标点击会"穿透"这一层,不影响下面按钮/链接的点击 */
  overflow: hidden;
}

.glow-cursor__canvas {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
  user-select: none;
}


/* src/components/Hero.css */
.hero-region {
  position: relative;
  height: 100vh;
}

.hero-sticky {
  position: relative;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
}

.hero-poster,
.hero-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.hero-poster {
  background-size: cover;
  background-position: center;
  z-index: 0;
}

.hero-video {
  z-index: 1;
  object-position: 72% center;
  background: #070708;
}

.hero-vignette {
  position: absolute;
  inset: 0;
  z-index: 2;
  background:
    linear-gradient(180deg, rgba(10, 10, 11, 0.15) 0%, rgba(10, 10, 11, 0.35) 55%, rgba(10, 10, 11, 0.92) 100%),
    linear-gradient(90deg, rgba(10, 10, 11, 0.85) 0%, rgba(10, 10, 11, 0.15) 45%, rgba(10, 10, 11, 0) 65%);
}

.hero-content {
  position: relative;
  z-index: 3;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding-top: 140px;
  padding-bottom: 48px;
}

.hero-title-block {
  max-width: 100%;
}

.hero-title-row {
  overflow: visible;
  white-space: nowrap;
}

.hero-title-word {
  display: inline-block;
  font-family: var(--font-hero);
  font-weight: 400; /* Anton 本身只有一个粗细,但笔画天生就很粗很重 */
  font-size: clamp(72px, 12vw, 200px); /* 姓名主标题尺寸 */
  line-height: 0.86;
  letter-spacing: 0;
  text-transform: none; /* Anton 大小写字形不同,保留大小写混排的效果 */
}

/* "Portfolio" 这一行原来是截图抠出来的图片,裁切打字效果边缘发虚
   使用与姓名相同的 Anton 字体。字号比第一版
   缩小了(大概相当于少了3个字母的宽度),字间距也收紧了一点,
   不会再顶到屏幕边缘、被视频画面挡住了。 */
.hero-title-portfolio {
  font-size: clamp(100px, 16vw, 280px);
  letter-spacing: -0.05em;
  transform: scaleY(1.333);
  transform-origin: left bottom;
  text-shadow: 0 0 18px rgba(255, 60, 32, 0.12);
}

/* 进入首页后标题先快速扫入，再由逐字显现完成，速度贴近参考演示。 */
.hero-title-row:first-child {
  animation: hero-fast-title-in 0.42s cubic-bezier(.2,.75,.2,1) both;
}
@keyframes hero-fast-title-in {
  0% { opacity: 0; transform: translateX(-20px) skewX(-5deg); filter: blur(5px); }
  48% { opacity: 1; filter: blur(0); }
  74% { transform: translateX(3px) skewX(1deg); }
  100% { opacity: 1; transform: translateX(0) skewX(0); filter: blur(0); }
}

/* 打字机光标——细细一条竖线,不停闪烁,像真的打字机/终端在敲字 */
.hero-type-cursor {
  display: inline-block;

  background: var(--red);
  vertical-align: -0.05em;

@keyframes hero-cursor-blink {

}

/* src/components/IllustrationMasonry.css */
/* 固定高度的"舞台",瀑布流再多图片也不会撑高整个页面 */
.illustration-stage {
  position: relative;
  margin-top: 48px;
  height: min(820px, 82vh);
  overflow: hidden;
}

.illustration-grid-scroll {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  padding: 24px;
}

.masonry {
  column-count: 5;
  column-gap: 18px;
}

.masonry-item {
  position: relative;
  display: block;
  width: 100%;
  margin-bottom: 22px;
  break-inside: avoid;
  padding: 0;
  border: none;
  text-align: left;
  background: none;
}

.masonry-thumb {
  display: block;
  overflow: hidden;
  border-radius: 16px;
  border: 1px solid var(--glass-border);
}

.masonry-item img {
  width: 100%;
  display: block;
  transition: transform 0.4s ease;
}

.masonry-item:hover img {
  transform: scale(1.04);
}

.masonry-caption {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 10px 2px 0;
}

.masonry-caption-en {

  letter-spacing: 0.04em;
}

.masonry-caption-cjk {

  font-size: 12px;
}

}
@media (max-width: 1100px) {
  .masonry { column-count: 3; }
}
@media (max-width: 800px) {
  .masonry { column-count: 2; }
}
@media (max-width: 480px) {
  .masonry { column-count: 1; }
}

/* ---- 详情状态:左缩略图 / 中大图 / 右应用效果 ---- */
.illustration-detail {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: 260px 1fr 260px;
  gap: 1px;
  background: var(--glass-border);
}

.illustration-back-btn {
  position: absolute;
  top: 16px;
  left: 16px;
  z-index: 5;
  padding: 10px 18px;

.illustration-thumbrail {

  flex-direction: column;
  gap: 10px;
}

.illustration-thumb {

  border-radius: 8px;
  overflow: hidden;
  padding: 0;
  opacity: 0.55;
  flex-shrink: 0;
}

.illustration-thumb img {
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  display: block;
}

.illustration-thumb.is-active {
  opacity: 1;
  border-color: var(--red);
}

.illustration-main {

  overflow: hidden;

  justify-content: center;

.illustration-main img {

  max-height: 100%;

}

/* 中文名 + 英文名一起显示,中文在上、英文小一号在下(跟其他
   模块"中英双语"的排版方式保持一致)。 */
.illustration-main-caption {
  position: absolute;
  left: 20px;
  bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 2px;

.illustration-main-caption-en {

.illustration-side {
